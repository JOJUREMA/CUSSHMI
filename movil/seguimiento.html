<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Seguimiento PDA — CUSSHMI Móvil</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#003876">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../assets/supabase/supabase-config.js"></script>
    <script src="../assets/supabase/supabase-client.js"></script>
    <script src="../assets/supabase/auth.js"></script>
    <script src="../assets/supabase/migracion.js"></script>
    <script src="../assets/supabase/datos.js"></script>
    <script src="../assets/supabase/bloqueo.js"></script>
    <script src="../assets/supabase/auditoria.js"></script>
    <script src="../assets/supabase/presencia.js"></script>
    <script src="../assets/core/clasificacion.js"></script>
    <script src="../assets/core/utilidades.js"></script>
    <script src="../assets/core/anexoG2.js"></script>
    <script src="../assets/core/mapa.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .fila-linea-tiempo {
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-left: 4px solid transparent;
        }
        .fila-linea-tiempo.en-curso {
            background: rgba(200, 168, 75, 0.18);
            border-left-color: #c8a84b;
        }
        .fila-linea-tiempo.proximo {
            background: rgba(255, 255, 255, 0.07);
            border-left-color: #2563eb;
        }
        .fila-linea-tiempo.finalizado {
            background: rgba(255, 255, 255, 0.04);
            border-left-color: #475569;
            opacity: 0.65;
        }
        .fila-linea-tiempo.sin-horario {
            background: rgba(220, 53, 69, 0.10);
            border-left-color: #c0392b;
        }
        .badge-estado {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .badge-estado.en-curso { background: #c8a84b; color: #002555; }
        .badge-estado.proximo { background: #2563eb; color: #fff; }
        .badge-estado.finalizado { background: #475569; color: #fff; }
        .badge-estado.sin-horario { background: #c0392b; color: #fff; }
        .grupo-titulo {
            width: 100%;
            max-width: 420px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.75;
            margin: 16px 0 8px;
        }
        .reloj-en-vivo {
            font-size: 10.5px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .punto-en-vivo {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 5px;
            vertical-align: middle;
        }
        #mapaSeguimiento {
            width: 100%;
            max-width: 420px;
            height: 50vh;
            border-radius: 10px;
            margin-top: 18px;
            display: none;
        }
        #panelPredioSeguimiento {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(200, 168, 75, 0.4);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 12px;
            display: none;
        }
        .leyenda-mapa-seguimiento {
            width: 100%;
            max-width: 420px;
            font-size: 10.5px;
            opacity: 0.7;
            margin: 8px 0 4px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="pantalla">
        <div class="encabezado-modulo">
            <a class="volver" href="index.html" title="Volver al menú">←</a>
            <h2>📡 Seguimiento PDA</h2>
        </div>

        <div class="campo" style="width:100%; max-width:420px;">
            <label for="selectSemanaSeguimiento">Semana</label>
            <select id="selectSemanaSeguimiento"></select>
        </div>

        <div class="campo" style="width:100%; max-width:420px;">
            <label for="selectTomaSeguimiento">Selecciona una toma</label>
            <select id="selectTomaSeguimiento">
                <option value="">-- Elige una toma --</option>
            </select>
        </div>

        <div class="estado-busqueda" id="estadoSeguimiento"></div>
        <div class="reloj-en-vivo" id="relojEnVivo"></div>
        <div id="lineaTiempoContainer" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top:8px;"></div>

        <div class="estado-busqueda" id="estadoMapaSeguimiento"></div>
        <div id="mapaSeguimiento"></div>
        <div id="panelPredioSeguimiento"></div>
        <div class="leyenda-mapa-seguimiento" id="leyendaMapaSeguimiento" style="display:none;">
            Se muestran todos los predios de la toma (levantamiento GIS,
            mapas/*.kml). 🟨 Mostaza = en turno de riego ahora mismo. 🟦 Azul
            = programado en la semana consultada, fuera de su turno todavía.
            Sin sombrear = no programado esta semana. Toca un predio para ver
            su detalle.
        </div>
    </div>

    <script>
        var perfilActual = null;
        var comisionKeyActual = null;
        var tomaSeleccionada = null;
        var cultivosTomaActual = [];
        var canalRealtime = null;
        var intervaloReloj = null;

        var elEstado = document.getElementById('estadoSeguimiento');
        var elReloj = document.getElementById('relojEnVivo');
        var elLineaTiempo = document.getElementById('lineaTiempoContainer');

        // ── Mapa de predios, embebido al final de la lista (antes era la
        // pantalla aparte movil/mapa.html) — a pedido del usuario, muestra
        // solo los predios de los usuarios QUE YA ESTÁN en la lista de
        // seguimiento de arriba (no todos los predios de la toma), así que
        // se actualiza solo con cambiar de toma/semana, igual que la lista.
        var elEstadoMapa = document.getElementById('estadoMapaSeguimiento');
        var elMapaContainer = document.getElementById('mapaSeguimiento');
        var elPanelPredio = document.getElementById('panelPredioSeguimiento');
        var elLeyendaMapa = document.getElementById('leyendaMapaSeguimiento');
        var mapaLeaflet = null;
        var capaSatelital = null;
        var capaPredios = null;
        var prediosPorTomaCache = {}; // { tomaNombre: predios[] } — el KML no cambia entre refrescos de 30s

        function obtenerLunesActual() {
            var hoy = new Date();
            var diaSemana = hoy.getDay();
            var offsetHastaLunes = diaSemana === 0 ? -6 : 1 - diaSemana;
            var lunes = new Date(hoy);
            lunes.setDate(hoy.getDate() + offsetHastaLunes);
            var y = lunes.getFullYear();
            var m = String(lunes.getMonth() + 1).padStart(2, '0');
            var d = String(lunes.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        // Compara el horario ya guardado (Fase 3) contra "ahora" — no
        // recalcula nada, solo clasifica lo que el escritorio ya calculó.
        function calcularEstadoUsuario(usuario, ahora) {
            if (!usuario.inicioTexto || !usuario.terminoTexto) return 'sin-horario';
            var inicio = parsearFechaHoraTexto(usuario.inicioTexto);
            var termino = parsearFechaHoraTexto(usuario.terminoTexto);
            if (ahora < inicio) return 'proximo';
            if (ahora > termino) return 'finalizado';
            return 'en-curso';
        }

        var ETIQUETAS_ESTADO = {
            'en-curso': 'En curso',
            'proximo': 'Próximo',
            'finalizado': 'Finalizado',
            'sin-horario': 'Sin horario'
        };

        var semanaSeleccionada = null;

        async function poblarSelectorSemanas() {
            var selectSemana = document.getElementById('selectSemanaSeguimiento');
            var semanaActual = obtenerLunesActual();

            var resultado = await CusshmiDatos.listarSemanasConProgramacion(comisionKeyActual);
            var semanas = (resultado.ok && resultado.semanas) ? resultado.semanas : [];
            if (!semanas.some(function (s) { return s.semanaInicio === semanaActual; })) {
                semanas.unshift({ semanaInicio: semanaActual, semanaFin: null });
            }

            selectSemana.innerHTML = '';
            semanas.forEach(function (s) {
                var opt = document.createElement('option');
                opt.value = s.semanaInicio;
                var etiqueta = 'Semana del ' + formatearFecha(s.semanaInicio) + (s.semanaFin ? ' al ' + formatearFecha(s.semanaFin) : '');
                if (s.semanaInicio === semanaActual) etiqueta += ' (actual)';
                opt.textContent = etiqueta;
                selectSemana.appendChild(opt);
            });

            semanaSeleccionada = semanaActual;
            poblarSelectorTomas();
        }

        document.getElementById('selectSemanaSeguimiento').addEventListener('change', function (e) {
            semanaSeleccionada = e.target.value;
            limpiarSuscripcionYReloj();
            tomaSeleccionada = null;
            document.getElementById('lineaTiempoContainer').innerHTML = '';
            poblarSelectorTomas();
        });

        async function poblarSelectorTomas() {
            var select = document.getElementById('selectTomaSeguimiento');
            select.innerHTML = '<option value="">-- Elige una toma --</option>';
            var resultado = await CusshmiDatos.cargarTodasLasProgramaciones(comisionKeyActual, semanaSeleccionada);

            if (!resultado.ok) {
                elEstado.textContent = 'No se pudo cargar la programación de esta semana.';
                return;
            }
            if (resultado.programaciones.length === 0) {
                elEstado.textContent = 'No hay tomas programadas esta semana todavía.';
                return;
            }
            elEstado.textContent = '';

            // Mismo orden "como están en el sistema" que ya usa el Anexo G2
            // (compararOrdenTomas, assets/core/anexoG2.js): empieza en SD3 y
            // termina en SD14.1, sin agrupar por programador, con
            // AGROAURORA/EL LOBO siempre al final. Ya vienen filtradas a solo
            // las tomas con programación (resultado.programaciones = las de
            // esta comisión+semana), no hace falta filtrar de nuevo.
            var programaciones = resultado.programaciones.slice().sort(function (a, b) {
                return compararOrdenTomas(a.toma, b.toma);
            });

            programaciones.forEach(function (p) {
                var opt = document.createElement('option');
                opt.value = p.toma;
                opt.textContent = p.toma;
                opt.dataset.programacionId = p.programacionId;
                opt.dataset.cultivos = JSON.stringify((p.datos && p.datos.cultivos) || []);
                select.appendChild(opt);
            });
        }

        function limpiarSuscripcionYReloj() {
            if (canalRealtime) {
                CusshmiDatos.cancelarSuscripcion(canalRealtime);
                canalRealtime = null;
            }
            if (intervaloReloj) {
                clearInterval(intervaloReloj);
                intervaloReloj = null;
            }
        }

        async function cargarSeguimientoDeToma(nombreToma, programacionId, cultivos) {
            elEstado.textContent = 'Cargando horario…';
            elLineaTiempo.innerHTML = '';

            var listas = await Promise.all(cultivos.map(function (c) {
                return CusshmiDatos.cargarUsuariosG3Seleccionados(comisionKeyActual, nombreToma, semanaSeleccionada, c.cultivo);
            }));
            var usuarios = [];
            listas.forEach(function (r, i) {
                if (r.ok && r.usuarios) {
                    r.usuarios.forEach(function (u) { usuarios.push(Object.assign({ cultivo: cultivos[i].cultivo }, u)); });
                }
            });

            if (usuarios.length === 0) {
                elEstado.textContent = 'No hay usuarios con horario confirmado para esta toma todavía.';
                renderizarMapaSeguimiento(nombreToma, []);
                return;
            }

            elEstado.innerHTML = '<span class="punto-en-vivo"></span>En vivo — ' + usuarios.length + ' usuario(s).';
            renderizarLineaTiempo(usuarios);
        }

        function renderizarLineaTiempo(usuarios) {
            var ahora = new Date();
            elReloj.textContent = 'Actualizado: ' + ahora.toLocaleTimeString('es-PE');

            var conEstado = usuarios.map(function (u) {
                return Object.assign({ estado: calcularEstadoUsuario(u, ahora) }, u);
            });

            var orden = { 'en-curso': 0, 'proximo': 1, 'finalizado': 2, 'sin-horario': 3 };
            conEstado.sort(function (a, b) {
                if (orden[a.estado] !== orden[b.estado]) return orden[a.estado] - orden[b.estado];
                var ta = a.inicioTexto ? parsearFechaHoraTexto(a.inicioTexto).getTime() : 0;
                var tb = b.inicioTexto ? parsearFechaHoraTexto(b.inicioTexto).getTime() : 0;
                return ta - tb;
            });

            elLineaTiempo.innerHTML = '';
            var grupoActual = null;
            conEstado.forEach(function (u) {
                if (u.estado !== grupoActual) {
                    grupoActual = u.estado;
                    var titulo = document.createElement('div');
                    titulo.className = 'grupo-titulo';
                    titulo.textContent = ETIQUETAS_ESTADO[grupoActual];
                    elLineaTiempo.appendChild(titulo);
                }

                var fila = document.createElement('div');
                fila.className = 'fila-linea-tiempo ' + u.estado;
                var detalle = (u.estado === 'sin-horario')
                    ? 'Horario aún no confirmado en escritorio.'
                    : 'Cultivo: ' + escapeHtml(u.cultivo || '-') + ' · ' +
                      escapeHtml(u.inicioTexto || '-') + ' → ' + escapeHtml(u.terminoTexto || '-') + ' · ' +
                      (parseFloat(u.caudalLs) || 0).toFixed(2) + ' l/s';
                fila.innerHTML =
                    '<div class="nombre-usuario-g3">' + escapeHtml(u.nombre || '-') +
                    '<span class="badge-estado ' + u.estado + '">' + ETIQUETAS_ESTADO[u.estado] + '</span></div>' +
                    '<div style="font-size:11.5px; opacity:0.85; margin-top:4px;">' + detalle + '</div>';
                elLineaTiempo.appendChild(fila);
            });

            renderizarMapaSeguimiento(tomaSeleccionada, conEstado);
        }

        // Colores del mapa: solo 3 categorías (a pedido del usuario, más
        // simple que un color por cada uno de los 4 estados de la lista).
        // - EN CURSO ("en turno de riego" ahora mismo): mostaza, como antes.
        // - Programado pero NO en curso (próximo/finalizado/sin horario):
        //   azul, bien saturado — debe resaltar claramente sobre el resto.
        // - No programado en esta toma/semana: gris tenue, solo contorno
        //   (COLOR_PREDIO_NO_PROGRAMADO, abajo) — para verse claramente por
        //   debajo de los dos anteriores.
        var COLOR_EN_CURSO_MAPA = { bg: 'rgba(200, 168, 75, 0.55)', border: '#c8a84b' };
        var COLOR_PROGRAMADO_MAPA = { bg: 'rgba(37, 99, 235, 0.55)', border: '#1d4ed8' };
        // Predios de la toma que NO están en la lista de seguimiento de esta
        // semana (no programados, o programados pero sin horario confirmado
        // todavía) — se muestran igual (para ver la toma completa) pero SIN
        // sombrear, solo el contorno.
        var COLOR_PREDIO_NO_PROGRAMADO = { bg: 'rgba(148, 163, 184, 0.06)', border: 'rgba(148, 163, 184, 0.55)' };

        async function obtenerPrediosDeToma(tomaNombre) {
            if (prediosPorTomaCache[tomaNombre]) return prediosPorTomaCache[tomaNombre];
            var archivos = (typeof KML_POR_TOMA !== 'undefined' && KML_POR_TOMA[tomaNombre]) || [];
            if (archivos.length === 0) {
                prediosPorTomaCache[tomaNombre] = [];
                return [];
            }
            var listas = await Promise.all(archivos.map(function (nombreArchivo) {
                return fetch('../mapas/' + nombreArchivo).then(function (resp) {
                    if (!resp.ok) throw new Error('No se pudo descargar ' + nombreArchivo);
                    return resp.text();
                }).then(function (texto) { return parsearKmlATomas(texto); });
            }));
            var todos = [].concat.apply([], listas);
            var predios = filtrarPorToma(todos, tomaNombre);
            prediosPorTomaCache[tomaNombre] = predios;
            return predios;
        }

        // Empareja un predio del KML con un usuario de ESTA lista de
        // seguimiento (no con el padrón completo) — primero por unidad
        // catastral, si no por nombre normalizado. Mismo criterio de
        // emparejamiento que cruzarPredioConPadron() en assets/core/mapa.js,
        // adaptado a la forma de usuarios_g3_seleccionados en vez de
        // padron_usuarios.
        function emparejarPredioConUsuario(predio, usuariosConEstado) {
            var usuario = null;
            if (predio.catastralKey) {
                usuario = usuariosConEstado.find(function (u) {
                    return (u.unidadCatastral || '').toString().trim() === predio.catastralKey;
                }) || null;
            }
            if (!usuario && predio.usuario) {
                var nombreNorm = predio.usuario.toString().trim().toUpperCase();
                usuario = usuariosConEstado.find(function (u) {
                    return (u.nombre || '').toString().trim().toUpperCase() === nombreNorm;
                }) || null;
            }
            return usuario;
        }

        function inicializarMapaSeguimientoSiHaceFalta() {
            if (mapaLeaflet) return;
            mapaLeaflet = L.map('mapaSeguimiento', { preferCanvas: true });
            capaSatelital = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics',
                maxZoom: 19
            });
            capaSatelital.addTo(mapaLeaflet);
        }

        function mostrarPanelPredioSeguimiento(props) {
            if (!props._programado) {
                // Predio de la toma que no está en la lista de seguimiento de
                // esta semana — se muestra la info cruda del KML nomás.
                elPanelPredio.innerHTML =
                    '<div class="nombre-usuario-g3">' + escapeHtml(props.usuario || 'Sin nombre en KML') + '</div>' +
                    '<div style="font-size:11.5px; opacity:0.85; margin-top:4px;">Lateral: ' + escapeHtml(props.lateral || '-') +
                    ' · Área (KML): ' + (parseFloat(props.areaHa) || 0).toFixed(2) + ' ha</div>' +
                    '<div style="font-size:11.5px; opacity:0.7; margin-top:4px; font-style:italic;">No programado en la semana consultada.</div>';
                elPanelPredio.style.display = 'block';
                return;
            }
            var detalle = (props.estado === 'sin-horario')
                ? 'Horario aún no confirmado en escritorio.'
                : escapeHtml(props.inicioTexto || '-') + ' → ' + escapeHtml(props.terminoTexto || '-') + ' · ' +
                  (parseFloat(props.caudalLs) || 0).toFixed(2) + ' l/s';
            elPanelPredio.innerHTML =
                '<div class="nombre-usuario-g3">' + escapeHtml(props.nombre || '-') +
                '<span class="badge-estado ' + props.estado + '">' + ETIQUETAS_ESTADO[props.estado] + '</span></div>' +
                '<div style="font-size:11.5px; opacity:0.85; margin-top:4px;">Cultivo: ' + escapeHtml(props.cultivo || '-') + '</div>' +
                '<div style="font-size:11.5px; opacity:0.85; margin-top:2px;">' + detalle + '</div>';
            elPanelPredio.style.display = 'block';
        }

        // Se llama cada vez que la lista de arriba se refresca (cambio de
        // toma/semana, reloj de 30s, o Realtime) — reusa el KML ya
        // descargado (prediosPorTomaCache) y solo recalcula el cruce y el
        // color, nunca vuelve a descargar el KML en cada refresco.
        async function renderizarMapaSeguimiento(tomaNombre, usuariosConEstado) {
            usuariosConEstado = usuariosConEstado || [];
            if (!tomaNombre) {
                elMapaContainer.style.display = 'none';
                elPanelPredio.style.display = 'none';
                elLeyendaMapa.style.display = 'none';
                elEstadoMapa.textContent = '';
                return;
            }

            try {
                var predios = await obtenerPrediosDeToma(tomaNombre);
                if (predios.length === 0) {
                    // Toma sin predios mapeados todavía (KML no disponible para
                    // esa toma) — no es un error, simplemente no hay mapa que mostrar.
                    elMapaContainer.style.display = 'none';
                    elPanelPredio.style.display = 'none';
                    elLeyendaMapa.style.display = 'none';
                    elEstadoMapa.textContent = '';
                    return;
                }

                // TODOS los predios de la toma se muestran siempre — los que
                // coinciden con un usuario de la lista de arriba (esta
                // toma/semana) quedan sombreados por estado; el resto se ve
                // solo con el contorno, sin sombrear.
                var prediosMarcados = predios.map(function (p) {
                    var usuario = emparejarPredioConUsuario(p, usuariosConEstado);
                    return usuario ? Object.assign({}, p, usuario, { _programado: true }) : Object.assign({}, p, { _programado: false });
                });

                inicializarMapaSeguimientoSiHaceFalta();
                elMapaContainer.style.display = 'block';
                elLeyendaMapa.style.display = 'block';
                elEstadoMapa.textContent = '';
                setTimeout(function () { mapaLeaflet.invalidateSize(); }, 50);

                if (capaPredios) mapaLeaflet.removeLayer(capaPredios);

                var featureCollection = {
                    type: 'FeatureCollection',
                    features: prediosMarcados.map(function (p) {
                        return { type: 'Feature', properties: p, geometry: { type: 'Polygon', coordinates: [p.coordenadas] } };
                    })
                };

                capaPredios = L.geoJSON(featureCollection, {
                    style: function (feature) {
                        if (!feature.properties._programado) {
                            return { fillColor: COLOR_PREDIO_NO_PROGRAMADO.bg, color: COLOR_PREDIO_NO_PROGRAMADO.border, weight: 1, fillOpacity: 0.12 };
                        }
                        var color = (feature.properties.estado === 'en-curso') ? COLOR_EN_CURSO_MAPA : COLOR_PROGRAMADO_MAPA;
                        return { fillColor: color.bg, color: color.border, weight: 2, fillOpacity: 0.65 };
                    },
                    onEachFeature: function (feature, layer) {
                        layer.on('click', function () { mostrarPanelPredioSeguimiento(feature.properties); });
                    }
                }).addTo(mapaLeaflet);

                mapaLeaflet.fitBounds(capaPredios.getBounds(), { padding: [20, 20] });
            } catch (e) {
                elEstadoMapa.textContent = 'No se pudo cargar el mapa de predios: ' + (e.message || e);
            }
        }

        async function seleccionarToma(nombreToma, programacionId, cultivos) {
            limpiarSuscripcionYReloj();
            tomaSeleccionada = nombreToma;
            cultivosTomaActual = cultivos;

            await cargarSeguimientoDeToma(nombreToma, programacionId, cultivos);

            // Reloj: recalcula el estado (en_curso/proximo/finalizado) cada
            // 30s aunque los datos no cambien — el paso del tiempo por sí
            // solo mueve a un usuario de "próximo" a "en curso".
            intervaloReloj = setInterval(function () {
                cargarSeguimientoDeToma(nombreToma, programacionId, cultivos);
            }, 30000);

            // Realtime: si el personal cambia algo en escritorio (nuevo
            // horario, ajuste manual), se refresca sin esperar el reloj.
            if (programacionId) {
                canalRealtime = CusshmiDatos.suscribirseATomaEnVivo(programacionId, function () {
                    cargarSeguimientoDeToma(nombreToma, programacionId, cultivos);
                });
            }
        }

        document.getElementById('selectTomaSeguimiento').addEventListener('change', function (e) {
            var opt = e.target.selectedOptions[0];
            if (!opt || !opt.value) return;
            var cultivos = JSON.parse(opt.dataset.cultivos || '[]');
            seleccionarToma(opt.value, opt.dataset.programacionId, cultivos);
        });

        // Al salir de la pestaña/app se corta la suscripción y el reloj
        // (no dejar nada corriendo en segundo plano); al volver, si había
        // una toma elegida, se retoma el seguimiento en vivo desde cero
        // (recarga inmediata + reabre el canal) en vez de dejar la
        // pantalla "congelada" hasta que el usuario vuelva a elegir.
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                limpiarSuscripcionYReloj();
            } else if (tomaSeleccionada) {
                var opt = document.getElementById('selectTomaSeguimiento').selectedOptions[0];
                if (opt && opt.value) {
                    seleccionarToma(opt.value, opt.dataset.programacionId, JSON.parse(opt.dataset.cultivos || '[]'));
                }
            }
        });

        (async function iniciar() {
            if (typeof CusshmiAuth === 'undefined') {
                location.href = 'index.html';
                return;
            }
            var resultado = await CusshmiAuth.recuperarSesion();
            if (!resultado.ok) {
                location.href = 'index.html';
                return;
            }
            perfilActual = resultado.perfil;
            comisionKeyActual = perfilActual.comisionClave;
            if (comisionKeyActual) localStorage.setItem('cusshmi_comision', comisionKeyActual);
            poblarSelectorSemanas();
        })();
    </script>
</body>
</html>
