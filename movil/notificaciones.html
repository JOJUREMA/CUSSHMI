<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notificaciones — CUSSHMI Móvil</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#003876">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../assets/supabase/supabase-config.js"></script>
    <script src="../assets/supabase/supabase-client.js"></script>
    <script src="../assets/supabase/auth.js"></script>
    <script src="../assets/supabase/migracion.js"></script>
    <script src="../assets/supabase/datos.js"></script>
    <script src="../assets/supabase/auditoria.js"></script>

    <style>
        .fila-filtros { width: 100%; max-width: 420px; margin-bottom: 14px; }
        .fila-notificacion {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .fila-notificacion .icono-accion { font-size: 20px; line-height: 1; margin-top: 2px; }
        .fila-notificacion .cuerpo { flex: 1; min-width: 0; }
        .fila-notificacion .accion { font-size: 13.5px; font-weight: 700; }
        .fila-notificacion .modulo { font-size: 11px; opacity: 0.75; margin-top: 1px; }
        .fila-notificacion .registro { font-size: 12.5px; margin-top: 4px; word-break: break-word; }
        .fila-notificacion .usuario-fecha { font-size: 10.5px; opacity: 0.6; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="pantalla">
        <div class="encabezado-modulo">
            <a class="volver" href="index.html" title="Volver al menú">←</a>
            <h2>🔔 Notificaciones</h2>
        </div>

        <div class="campo fila-filtros">
            <label for="selectFiltroModulo">Filtrar por módulo</label>
            <select id="selectFiltroModulo">
                <option value="">Todos los módulos</option>
            </select>
        </div>

        <div class="estado-busqueda" id="estadoNotificaciones">Cargando…</div>
        <div class="resultados" id="listaNotificaciones"></div>
    </div>

    <script>
        var ICONO_POR_ACCION = {
            'Confirmación': '✅',
            'Desbloqueo': '🔓',
            'Solicitud de edición': '📩',
            'Rechazo de solicitud de edición': '❌',
            'Generación de enlace': '🔗',
            'Confirmación de recepción G-4': '✅',
            'Apertura de enlace': '👁️'
        };

        var elEstado = document.getElementById('estadoNotificaciones');
        var elLista = document.getElementById('listaNotificaciones');
        var elFiltro = document.getElementById('selectFiltroModulo');
        var todasLasFilas = [];

        function nombreUsuarioDeFila(fila) {
            var p = fila.profiles;
            if (!p) return 'Alguien';
            if (p.primer_nombre || p.primer_apellido) {
                return [p.primer_nombre, p.primer_apellido].filter(Boolean).join(' ');
            }
            return p.nombre_usuario || 'Alguien';
        }

        function formatearFechaHora(iso) {
            if (!iso) return '';
            var f = new Date(iso);
            if (isNaN(f.getTime())) return '';
            return f.toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function poblarFiltroModulos(filas) {
            var modulos = [];
            filas.forEach(function (f) {
                if (f.modulo && modulos.indexOf(f.modulo) === -1) modulos.push(f.modulo);
            });
            modulos.sort();
            elFiltro.innerHTML = '<option value="">Todos los módulos</option>' +
                modulos.map(function (m) { return '<option value="' + m.replace(/"/g, '&quot;') + '">' + m + '</option>'; }).join('');
        }

        function renderizarLista() {
            var filtro = elFiltro.value;
            var filas = filtro ? todasLasFilas.filter(function (f) { return f.modulo === filtro; }) : todasLasFilas;
            if (!filas.length) {
                elLista.innerHTML = '';
                elEstado.textContent = 'No hay notificaciones' + (filtro ? ' para ese módulo.' : ' todavía.');
                return;
            }
            elEstado.textContent = filas.length + (filas.length === 1 ? ' notificación' : ' notificaciones');
            elLista.innerHTML = filas.map(function (f) {
                var icono = ICONO_POR_ACCION[f.accion] || '📝';
                return '<div class="fila-notificacion">' +
                    '<div class="icono-accion">' + icono + '</div>' +
                    '<div class="cuerpo">' +
                    '<div class="accion">' + f.accion + '</div>' +
                    '<div class="modulo">' + (f.modulo || '') + '</div>' +
                    (f.registro_afectado ? '<div class="registro">' + f.registro_afectado + '</div>' : '') +
                    '<div class="usuario-fecha">' + nombreUsuarioDeFila(f) + ' · ' + formatearFechaHora(f.creado_en) + '</div>' +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        elFiltro.addEventListener('change', renderizarLista);

        // ═══ Arranque ═══
        (async function iniciar() {
            if (typeof CusshmiAuth === 'undefined') {
                location.href = 'index.html';
                return;
            }
            var resultado = await CusshmiAuth.recuperarSesion();
            if (!resultado.ok) {
                location.href = 'index.html';
                return;
            }
            if (resultado.perfil.rol !== 'admin') {
                elEstado.textContent = 'Esta pantalla es solo para administradores.';
                return;
            }
            todasLasFilas = await CusshmiAuditoria.listarAuditoria(200);
            localStorage.setItem('cusshmi_notif_vistas_en', new Date().toISOString());
            poblarFiltroModulos(todasLasFilas);
            renderizarLista();
        })();
    </script>
</body>
</html>
